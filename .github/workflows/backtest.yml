name: Backtest + Walk-forward
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Bitget USDT-futures symbol"
        default: "BTCUSDT"
      granularity:
        description: "Candle size (1H, 4H, 6H, 12H, 1D)"
        default: "4H"
      days:
        description: "Days of history"
        default: "1095"
  schedule:
    - cron: "0 6 * * 1"   # every Monday, 06:00 UTC
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run backtest and walk-forward (read-only)
        run: >
          python run_backtest.py
          --symbol "${{ github.event.inputs.symbol || 'BTCUSDT' }}"
          --granularity "${{ github.event.inputs.granularity || '4H' }}"
          --days "${{ github.event.inputs.days || '1095' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: |
            reports/
            data/*.csv
