name: Paper trading (simulated account)
on:
  workflow_dispatch:
    inputs:
      reset:
        description: "Start a fresh paper account"
        type: boolean
        default: false
  schedule:
    - cron: "2 */4 * * *"   # right after each 4H candle closes
permissions:
  contents: write   # publishes the dashboard to the gh-pages branch
concurrency:
  group: paper-trading
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore paper account
        if: ${{ github.event.inputs.reset != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: state/
          key: paper-state-${{ github.run_id }}
          restore-keys: paper-state-
      - name: One paper trading cycle (no real orders)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python trade.py --mode paper
          python paper_report.py >> "$GITHUB_STEP_SUMMARY"
      - name: Build dashboard
        if: always()
        run: python dashboard.py --record --signals --out site/index.html
      - name: Publish dashboard (gh-pages branch)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "dashboard $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard
          path: site/index.html
      - name: Save paper account
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/
          key: paper-state-${{ github.run_id }}
