name: Signal monitor (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: "5 */4 * * *"   # shortly after each 4H candle closes
jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: What every portfolio slot wants now (no orders are placed)
        run: python trade.py --mode signal
