name: Compare assets (walk-forward)
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history (1D candles need >= 1000)"
        default: "1825"
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run comparison (read-only, no orders)
        run: python compare.py --days "${{ github.event.inputs.days || '1825' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: compare-report
          path: reports/
