name: Market scan (choose coins + strategies)
on:
  workflow_dispatch:
    inputs:
      top:
        description: "How many most liquid USDT-M perpetuals to analyse"
        default: "30"
      max_sleeves:
        description: "Max coin/strategy slots in the portfolio"
        default: "6"
  schedule:
    - cron: "0 6 * * 1"   # every Monday, 06:00 UTC
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan market (read-only, no orders)
        run: >
          python scan_market.py
          --top "${{ github.event.inputs.top || '30' }}"
          --max-sleeves "${{ github.event.inputs.max_sleeves || '6' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: market-scan
          path: |
            reports/
            config/portfolio.json
